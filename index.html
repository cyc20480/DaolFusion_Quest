<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Daol Fusion Quest — AI 세일즈 마스터</title>
<style>
:root{--bg:#0d1b2a;--card:#16222f;--card2:#12314d;--line:#2a3a4d;--blue:#0d84d8;--brand:#0060a0;--txt:#e6f1fb;--sub:#8fb6d4;--dim:#5a6b7d;--good:#1d9e75;--bad:#d85a30;--gold:#efb832;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--bg);color:var(--txt);font-family:'Segoe UI','Apple SD Gothic Neo','Malgun Gothic',sans-serif;min-height:100%;}
#wrap{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
#hud{position:sticky;top:0;z-index:10;background:rgba(13,27,42,.97);border-bottom:1px solid var(--line);padding:10px 14px;}
#hud .r1{display:flex;justify-content:space-between;align-items:center;gap:8px;}
#hud .lv{font-size:13px;color:#4da3dd;font-weight:600;}
#hud .pts{font-size:13px;background:var(--card2);color:#85b7eb;padding:2px 10px;border-radius:10px;white-space:nowrap;}
#hud .pass{font-size:11px;color:var(--dim);margin-top:4px;display:flex;justify-content:space-between;}
#hud .bar{position:relative;height:6px;background:#1a2836;border-radius:3px;margin-top:4px;}
#hud .bar .fill{height:6px;background:var(--blue);border-radius:3px;transition:width .3s;}
#hud .bar .mark{position:absolute;top:-3px;width:2px;height:12px;background:var(--gold);}
#app{flex:1;padding:16px 14px 90px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;}
.qcard{background:var(--card2);border-radius:12px;padding:18px 16px;font-size:16px;line-height:1.6;margin-bottom:14px;}
.btn{display:block;width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:14px;font-size:15px;text-align:left;margin-bottom:9px;cursor:pointer;line-height:1.45;}
.btn:active{transform:scale(.985);}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;text-align:center;font-weight:600;}
.btn.ok{border-color:var(--good);background:#0f3328;}
.btn.no{border-color:var(--bad);background:#3a1c10;}
.btn.dis{opacity:.45;pointer-events:none;}
.tag{display:inline-block;font-size:11px;background:var(--card2);color:#85b7eb;padding:2px 8px;border-radius:8px;margin-right:4px;}
.tag.g{background:#0f3328;color:#9fe1cb;}.tag.o{background:#3a1c10;color:#f0997b;}.tag.y{background:#3a2f10;color:#f5d47b;}
.exp{background:#0f2438;border-left:3px solid var(--blue);padding:12px;font-size:14px;line-height:1.6;margin:10px 0;border-radius:0 8px 8px 0;}
.exp b{color:#4da3dd;}
.say{background:#0f3328;border-left:3px solid var(--good);padding:12px;font-size:14px;line-height:1.6;margin:10px 0;border-radius:0 8px 8px 0;}
.say b{color:#9fe1cb;}
h2{font-size:19px;margin-bottom:10px;}
h3{font-size:15px;color:#4da3dd;margin-bottom:8px;}
.sub{font-size:13px;color:var(--sub);line-height:1.6;}
.dim{font-size:12px;color:var(--dim);line-height:1.5;}
.center{text-align:center;}
.lvnode{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:9px;cursor:pointer;}
.lvnode.lock{opacity:.45;cursor:default;}
.lvnode.cur{border-color:var(--brand);background:#0e2a44;}
.lvnode .ico{width:38px;height:38px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
.lvnode.done .ico{background:var(--good);}
.lvnode .nm{font-size:14px;font-weight:600;}
.lvnode .st{font-size:11px;color:var(--dim);margin-top:2px;}
.gauge{position:relative;height:10px;background:#1a2836;border-radius:5px;margin:8px 0;}
.gauge .gf{height:10px;border-radius:5px;background:var(--good);transition:width .4s;}
.gauge .gm{position:absolute;top:-3px;width:2px;height:16px;background:var(--gold);}
.bubble{display:flex;gap:8px;margin-bottom:12px;align-items:flex-start;}
.bubble .av{width:34px;height:34px;border-radius:50%;background:var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:15px;}
.bubble .tx{background:var(--card);border-radius:2px 12px 12px 12px;padding:11px 13px;font-size:14px;line-height:1.55;max-width:85%;}
.bubble.me{flex-direction:row-reverse;}
.bubble.me .tx{background:var(--brand);color:#fff;border-radius:12px 2px 12px 12px;}
.react{font-size:13px;color:#f0997b;font-style:italic;margin:6px 0 10px 42px;line-height:1.5;}
.react.good{color:#9fe1cb;}
.topbtns{display:flex;gap:8px;margin-bottom:14px;}
.topbtns .tb{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;color:var(--sub);padding:9px 4px;font-size:12px;text-align:center;cursor:pointer;}
.pop{position:fixed;left:50%;transform:translateX(-50%);top:70px;background:var(--brand);color:#fff;padding:8px 18px;border-radius:20px;font-size:14px;font-weight:600;z-index:99;animation:pop 1.2s forwards;}
@keyframes pop{0%{opacity:0;transform:translateX(-50%) translateY(10px);}15%{opacity:1;transform:translateX(-50%) translateY(0);}80%{opacity:1;}100%{opacity:0;transform:translateX(-50%) translateY(-14px);}}
.shake{animation:shk .4s;}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.badge{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;}
.badge.off{opacity:.35;}
.badge .bi{font-size:22px;}
.badge .bn{font-size:13px;font-weight:600;}
.badge .bd{font-size:11px;color:var(--dim);}
input[type=text],select{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:8px;color:var(--txt);padding:11px;font-size:15px;margin:6px 0 12px;}
.chip{display:inline-block;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:7px 14px;font-size:13px;margin:0 6px 8px 0;cursor:pointer;color:var(--sub);}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff;}
.row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #1a2836;font-size:13px;}
.tgl{width:46px;height:26px;border-radius:13px;background:var(--line);position:relative;cursor:pointer;flex-shrink:0;}
.tgl.on{background:var(--good);}
.tgl:after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s;}
.tgl.on:after{left:23px;}
.timer{font-size:13px;background:#3a1c10;color:#f0997b;padding:2px 10px;border-radius:10px;}
footer{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(13,27,42,.97);border-top:1px solid var(--line);display:flex;z-index:10;}
footer .fb{flex:1;text-align:center;padding:10px 0 14px;font-size:11px;color:var(--dim);cursor:pointer;}
footer .fb.on{color:#4da3dd;}
footer .fb .fi{font-size:18px;display:block;margin-bottom:2px;}
</style>
</head>

{id:"M3",ind:"sec",role:"ai",tk:"증권사 AI 담당자 — GPU 전쟁 중",te:"Securities AI lead — GPU wars",

 {ck:"퀀트팀, 리서치팀이 GPU를 서로 차지하려고 싸웁니다. 장비 살 예산은 없고요.",ce:"Quant and research fight over GPUs. No budget for more.",
  ch:[{k:"AI Pub으로 GPU 1장을 최대 100조각까지 분할해 팀별로 할당·회수할 수 있습니다. 추가 구매 없이 해결됩니다.",e:"AI Pub splits one GPU into up to 100 blocks with per-team allocation. No new hardware.",d:18,rk:"분할 할당이 그렇게까지 된다고요?",re:"It partitions that finely?",b:1},
      {k:"GPU는 결국 더 사셔야 합니다.",e:"You'll have to buy more GPUs eventually.",d:-20,rk:"예산이 없다고 말씀드렸는데요.",re:"I just said there's no budget."},
      {k:"팀끼리 회의해서 정하시면 됩니다.",e:"Have the teams meet and decide.",d:-5,rk:"그게 안 되니까 부른 겁니다.",re:"We called you because that failed."}]},
 {ck:"자원을 나누면 누가 얼마나 썼는지 정산도 돼야 하는데요.",ce:"If we share, we need usage accounting per team.",
  ch:[{k:"AI Pub은 100개 이상 지표로 사용량을 추적하고 팀별 Billing·Chargeback 리포트까지 자동 생성합니다.",e:"AI Pub tracks 100+ metrics with automated per-team billing and chargeback reports.",d:18,rk:"정산 리포트가 자동이면 관리가 되겠네요.",re:"Automated chargeback — that's manageable.",b:1},
      {k:"엑셀로 정리하시면 됩니다.",e:"You can track it in Excel.",d:-20,rk:"그걸 자동화하려고 AI를 하자는 건데요…",re:"We're doing AI to escape Excel…"},
      {k:"정산까지는 어렵습니다.",e:"Accounting is hard to provide.",d:-5,rk:"그럼 반쪽짜리 아닌가요?",re:"Then it's half a solution."}]},
 {ck:"보안팀이 외부 솔루션 도입에 민감한데, 권한 관리는 어떻게 되죠?",ce:"Our security team is strict — how is access controlled?",
  ch:[{k:"RBAC 기반 권한 제어로 팀 단위 격리와 안전한 자원 공유를 지원합니다. 사용자 간 간섭도 차단됩니다.",e:"RBAC-based control with team isolation and safe sharing — no cross-user interference.",d:15,rk:"보안팀 설득 포인트가 되겠습니다.",re:"That's a point our security team will accept.",b:1},
      {k:"보안은 크게 신경 안 쓰셔도 됩니다.",e:"Security isn't a big deal here.",d:-20,rk:"증권사에서 그 말은 금기어입니다.",re:"Never say that at a securities firm."},
      {k:"방화벽이 있으니 괜찮습니다.",e:"You have a firewall, it's fine.",d:-5,rk:"내부 권한 관리를 물은 건데요.",re:"I asked about internal access control."}]}]},
{id:"M4",ind:"sec",role:"cio",tk:"증권사 CIO — 레퍼런스를 원한다",te:"Securities CIO — wants references",
 turns:[
 {ck:"금융권 도입 사례가 있습니까? 우리가 첫 번째는 곤란합니다.",ce:"Any finance references? We can't be first.",
  ch:[{k:"금융권에 AI OCR·온프레미스 LLM 구축 사례가 있고, 동종 업계 구성 그대로 제안 가능합니다. 레퍼런스 미팅도 주선하겠습니다.",e:"We have finance deployments of AI OCR and on-prem LLM, and can arrange reference calls.",d:18,rk:"레퍼런스 미팅까지 된다면 검토해 보죠.",re:"Reference calls? Then let's review.",b:1},
      {k:"첫 고객이 되시면 할인해 드립니다.",e:"Be our first customer and get a discount.",d:-20,rk:"우리는 실험대상이 되고 싶지 않습니다.",re:"We don't want to be the guinea pig."},
      {k:"사례는 비밀이라 말씀 못 드립니다.",e:"References are confidential, can't share.",d:-5,rk:"그럼 신뢰할 근거가 없잖습니까.",re:"Then what do I trust?"}]},
 {ck:"클라우드 AI 서비스를 쓰면 되지, 굳이 구축할 이유가 있나요?",ce:"Why build, when cloud AI services exist?",
  ch:[{k:"금융 규제상 고객 데이터의 외부 전송이 문제가 됩니다. 온프레미스는 데이터 주권과 장기 비용 관점에서 유리하고, 토큰 비용도 통제됩니다.",e:"Regulation restricts sending customer data out. On-prem wins on data sovereignty and long-run token cost control.",d:18,rk:"데이터 주권 관점은 설득력이 있네요.",re:"The sovereignty angle is convincing.",b:1},
      {k:"클라우드는 무조건 나쁩니다.",e:"Cloud is simply bad.",d:-20,rk:"우리도 클라우드 씁니다만…",re:"We do use cloud, you know…"},
      {k:"요즘 유행이 온프레미스입니다.",e:"On-prem is trendy now.",d:-5,rk:"유행 따라 수십억을 쓸 순 없죠.",re:"We don't spend billions on trends."}]},
 {ck:"도입한다면 실패 리스크는 어떻게 줄입니까?",ce:"How do we reduce the risk of failure?",
  ch:[{k:"PoC 센터에서 실데이터로 무상 검증 → 성공 기준 합의 → 단계적 확산. 검증 결과가 기준에 못 미치면 도입하지 않으셔도 됩니다.",e:"Free PoC with real data → agreed success criteria → phased rollout. If results miss the bar, don't adopt.",d:18,rk:"검증 후 결정이라면 리스크가 없군요.",re:"Verify then decide — that's low risk.",b:1},
      {k:"계약서에 위약금 조항을 넣으시죠.",e:"Put penalties in the contract.",d:-5,rk:"소송보다 성공이 목표인데요.",re:"I want success, not lawsuits."},
      {k:"리스크 없는 사업이 어디 있습니까.",e:"No business is risk-free.",d:-20,rk:"리스크를 줄이는 게 당신 일이잖아요.",re:"Reducing risk is your job."}]}]},
{id:"M5",ind:"fin",role:"ops",tk:"은행 전산실장 — 운영 인력이 없다",te:"Bank IT ops manager — short-staffed",
 turns:[
 {ck:"AI 좋은 건 알겠는데, 우리 인력으론 운영을 못 합니다. 관제 인력도 부족해요.",ce:"AI sounds nice, but we can't operate it — we're short on monitoring staff.",
  ch:[{k:"그래서 All-in-One입니다. 사전 구성된 어플라이언스라 운영 부담이 최소화되고, 다올TS가 통합 관제를 지원합니다.",e:"That's why it's all-in-one: a pre-configured appliance with minimal ops burden, monitored with DaolTS support.",d:18,rk:"운영을 같이 봐준다면 해볼 만하겠네요.",re:"With operations support, it's feasible.",b:1},
      {k:"운영 인력을 새로 뽑으시면 됩니다.",e:"Just hire more ops staff.",d:-20,rk:"그 예산이 없다는 얘기를 한 건데요.",re:"I just said we can't."},
      {k:"AI가 알아서 다 돌아갑니다.",e:"AI runs itself.",d:-5,rk:"25년 전산 인생에 알아서 되는 건 없었습니다.",re:"25 years in IT — nothing runs itself."}]},
 {ck:"기존 시스템과 호환은요? 우리는 장비가 제각각입니다.",ce:"Compatibility with our mixed legacy systems?",
  ch:[{k:"Dell 인프라 기반의 검증된 호환성이 강점입니다. 사전 검증된 조합이라 오픈소스를 직접 조립할 때 같은 호환성 리스크가 없습니다.",e:"Verified compatibility on Dell infrastructure — pre-validated stacks, unlike DIY open source.",d:15,rk:"조립 리스크가 없다는 건 크네요.",re:"No DIY risk — that matters.",b:1},
      {k:"호환 안 되면 그때 가서 보죠.",e:"We'll see if something breaks.",d:-20,rk:"은행 시스템을 그렇게 다루면 큰일 납니다.",re:"You can't treat bank systems that way."},
      {k:"전부 새로 바꾸시는 게 낫습니다.",e:"Better to replace everything.",d:-5,rk:"예산이 몇 배로 뛰는데요?",re:"That multiplies the budget."}]},
 {ck:"솔직히 유지보수 계약이 제일 걱정입니다. 업체들이 서로 미루더군요.",ce:"Honestly, maintenance contracts worry me — vendors pass the buck.",
  ch:[{k:"저희는 '핑퐁 금지'가 원칙입니다. 다올Fusion 플랫폼 위에서 ISV까지 통합 관제하므로 이슈 발생 시 저희가 1차 대응과 원인 분석까지 합니다.",e:"Our rule is 'no ping-pong.' We monitor ISVs on the platform and own first response and root cause.",d:18,rk:"그 원칙, 계약서에 꼭 넣어주세요.",re:"Put that rule in the contract, please.",b:1},
      {k:"유지보수는 별도 계약입니다.",e:"Maintenance is a separate contract.",d:-5,rk:"조건부터 말씀해 주셔야죠.",re:"Then state the terms up front."},
      {k:"저희는 장애가 거의 없어서요.",e:"We rarely have failures.",d:-5,rk:"'거의'가 은행에선 사고입니다.",re:"'Rarely' is an incident at a bank."}]}]},
{id:"M6",ind:"fin",role:"lob",tk:"캐피탈사 심사본부장 — 숫자로 말해라",te:"Capital firm credit head — show me numbers",
 turns:[
 {ck:"AI 도입하면 심사 건당 비용이 얼마나 줄어듭니까? 숫자로 말해 주세요.",ce:"How much does per-case cost drop? Give me numbers.",
  ch:[{k:"고객사 사례 기준 서류 처리 시간이 대폭 단축됐습니다. 귀사 실데이터로 PoC를 돌려 건당 비용 절감액을 직접 산출해 드리겠습니다.",e:"References show large time cuts. Let's run a PoC on your data and compute your per-case savings.",d:18,rk:"우리 숫자로 뽑아준다니 좋습니다.",re:"Our own numbers — good.",b:1},
      {k:"AI는 비용이 아니라 미래를 위한 투자입니다.",e:"AI is an investment in the future, not a cost.",d:-20,rk:"멋진 말이지만 저는 KPI로 삽니다.",re:"Nice words, but I live on KPIs."},
      {k:"대략 많이 줄어듭니다.",e:"Roughly, a lot.",d:-5,rk:"'대략'으론 품의를 못 올립니다.",re:"'Roughly' won't pass approval."}]},
 {ck:"심사 자동화라면 결국 룰 기반 아닙니까? 예전에 해봤는데 실패했어요.",ce:"Isn't this just rule-based automation? We tried and failed.",
  ch:[{k:"룰이 아니라 문서를 이해하는 AI입니다. 비정형 서류를 VLM이 읽고, 업무특화 RAG가 심사 규정을 근거로 판단을 보조합니다. 실패하셨던 지점부터 PoC로 확인하시죠.",e:"Not rules — AI that reads documents. VLM parses unstructured files; task-specific RAG grounds judgment in your policies. Let's PoC exactly where you failed before.",d:18,rk:"실패했던 지점부터 검증한다… 마음에 드네요.",re:"Testing where we failed — I like that.",b:1},
      {k:"예전 기술과는 완전히 다릅니다. 믿어보세요.",e:"It's totally different now, trust me.",d:-5,rk:"믿음은 검증 다음입니다.",re:"Trust comes after proof."},
      {k:"그때 업체가 실력이 없었나 보죠.",e:"Your old vendor must've been bad.",d:-20,rk:"그 업체 선정한 게 접니다만.",re:"I picked that vendor, you know."}]},
 {ck:"경영진 보고에 쓸 핵심 한 줄이 필요합니다.",ce:"I need one line for the executive report.",
  ch:[{k:"'검증된 ISV 일체형 도입으로 심사 처리시간 단축과 건당 비용 절감을 PoC 수치로 확인 후 단계 도입' — 리스크 없이 성과만 가져가는 구조입니다.",e:"'Phased adoption after PoC-verified cuts in processing time and per-case cost' — benefits without the risk.",d:15,rk:"그대로 보고서에 쓰겠습니다.",re:"Going straight into my report.",b:1},
      {k:"'AI 트렌드에 동참' 어떻습니까?",e:"How about 'joining the AI trend'?",d:-20,rk:"트렌드로는 예산이 안 나옵니다.",re:"Trends don't get budgets."},
      {k:"한 줄로는 어렵고 30장 자료를 드리죠.",e:"Hard in one line — here's 30 slides.",d:-5,rk:"경영진은 30장을 안 읽습니다.",re:"Executives don't read 30 slides."}]}]},
{id:"M7",ind:"pub",role:"ops",tk:"공공기관 전산실장 — 예산과 경험 부족",te:"Public agency IT manager — tight budget, no experience",
 turns:[
 {ck:"AI를 하라는 지시는 내려왔는데, 예산도 적고 해본 사람도 없습니다.",ce:"We're ordered to 'do AI' — small budget, zero experience.",
  ch:[{k:"그런 기관을 위해 Starter 구성이 있습니다. 사전 구성된 장비라 구축 경험이 없어도 Day1부터 쓸 수 있고, 비용도 단계 도입으로 최소화됩니다.",e:"Starter exists exactly for this: pre-configured, usable from day one without build experience, phased cost.",d:18,rk:"경험 없이도 된다는 게 제일 중요합니다.",re:"Working without expertise — that's key.",b:1},
      {k:"우선 컨설팅부터 6개월 받으시죠.",e:"Start with 6 months of consulting.",d:-5,rk:"예산이 적다고 말씀드렸는데요.",re:"I said the budget is small."},
      {k:"AI는 원래 어렵습니다.",e:"AI is inherently hard.",d:-20,rk:"위로가 아니라 방법을 듣고 싶습니다.",re:"I need solutions, not sympathy."}]},
 {ck:"국산 솔루션 우선 요건이 있습니다. 외산 위주 아닌가요?",ce:"We must prefer domestic solutions. Isn't this foreign-heavy?",
  ch:[{k:"핵심이 국산입니다. 업스테이지 Solar 같은 국산 최고 수준 모델과 몬드리안AI 등 국내 ISV 솔루션 조합이라 소버린 AI 요건에 정확히 맞습니다.",e:"The core is Korean — Upstage Solar plus domestic ISVs like Mondrian AI. It fits sovereign-AI requirements precisely.",d:18,rk:"국산 모델 조합이라면 요건 충족이 되겠네요.",re:"Korean models — that meets the rule.",b:1},
      {k:"요즘 국산·외산 구분이 무의미합니다.",e:"The domestic/foreign divide is meaningless now.",d:-20,rk:"저희 규정에는 의미가 있습니다.",re:"It's meaningful in our regulations."},
      {k:"글쎄요, 확인해 보겠습니다.",e:"Hmm, I'll have to check.",d:-5,rk:"준비가 안 되신 것 같네요.",re:"You seem unprepared."}]},
 {ck:"감사에 대비해 도입 근거를 남겨야 합니다. 어떻게 하죠?",ce:"We need an audit trail justifying adoption.",
  ch:[{k:"PoC 검증 보고서가 곧 도입 근거가 됩니다. 성능·비용 수치와 국산 요건 충족 내역을 문서로 정리해 드리겠습니다.",e:"The PoC report becomes your justification — performance, cost, and domestic-requirement compliance, documented.",d:15,rk:"감사 대응 문서까지, 꼼꼼하시네요.",re:"Audit-ready documents — thorough.",b:1},
      {k:"감사는 걸리면 그때 대응하시죠.",e:"Deal with audits when they come.",d:-20,rk:"공공기관에서 그러다 큰일 납니다.",re:"That's how careers end in public service."},
      {k:"다른 기관도 다 하니 괜찮습니다.",e:"Everyone else does it, so it's fine.",d:-5,rk:"'남들도 한다'는 감사 근거가 아닙니다.",re:"'Everyone does it' isn't a justification."}]}]},
{id:"M8",ind:"pub",role:"caio",tk:"지자체 CAIO — AI 행정 비전",te:"City CAIO — AI government vision",
 turns:[
 {ck:"시민 체감형 AI 행정 서비스를 만들고 싶습니다. 어디서 시작해야 할까요?",ce:"We want AI services citizens can feel. Where to start?",
  ch:[{k:"민원 응대·문서 안내처럼 반복량이 많고 효과가 눈에 보이는 업무부터 시작해, 성공 사례를 만들고 확산하는 로드맵을 권합니다.",e:"Start with high-volume, visible work — civil inquiries, document guidance — build a win, then scale.",d:18,rk:"작게 이겨서 확산한다, 동의합니다.",re:"Win small, then scale — agreed.",b:1},
      {k:"전 부서에 한 번에 도입하시죠.",e:"Roll out to every department at once.",d:-20,rk:"실패하면 시의회가 가만 안 둡니다.",re:"If that fails, the council will roast us."},
      {k:"일단 챗봇 하나 만들어 보시죠.",e:"Just build a chatbot first.",d:-5,rk:"챗봇은 10년 전에도 했습니다.",re:"We built chatbots a decade ago."}]},
 {ck:"시민 데이터를 다루니 민간 클라우드 AI는 곤란합니다.",ce:"Citizen data means public cloud AI is off the table.",
  ch:[{k:"온프레미스 구축에 업스테이지 Solar 같은 국산 모델 기반이면 데이터 주권과 소버린 요건을 모두 충족합니다. 규제 환경에 최적화된 구성입니다.",e:"On-prem with a Korean model like Upstage Solar meets both data sovereignty and sovereign-AI rules — built for regulated environments.",d:18,rk:"딱 저희 조건에 맞는 구성이군요.",re:"That fits our constraints exactly.",b:1},
      {k:"클라우드도 보안이 좋아졌습니다.",e:"Cloud security has improved a lot.",d:-5,rk:"제 말을 안 들으셨군요.",re:"You didn't hear me."},
      {k:"데이터는 어차피 다 뚫립니다.",e:"All data leaks eventually.",d:-20,rk:"그 발언, 기록에 남기겠습니다.",re:"I'm putting that remark on record."}]},
 {ck:"예산 심의에서 '왜 이 구성이냐'를 방어해야 합니다.",ce:"I must defend this configuration in budget review.",
  ch:[{k:"검증된 일체형이라 SI 대비 구축 기간·비용이 절감되고, PoC 수치가 근거가 됩니다. 단계별 확산 계획서까지 함께 준비해 드리겠습니다.",e:"Pre-integrated cuts build time and cost vs. SI; PoC numbers are your evidence. We'll prepare the phased plan with you.",d:15,rk:"심의 자료를 같이 만들어준다니 좋네요.",re:"Help with the review docs — excellent.",b:1},
      {k:"싸니까 통과될 겁니다.",e:"It's cheap, it'll pass.",d:-5,rk:"싼 게 근거가 되진 않죠.",re:"Cheap isn't a rationale."},

 {ck:"GPU 자원 사용 현황을 경영진에 보고해야 하는데 파악이 안 됩니다.",ce:"I must report GPU utilization to management, but we can't measure it.",

{id:"M11",ind:"def",role:"cio",tk:"방산기업 CIO — 완전 폐쇄망",te:"Defense CIO — fully air-gapped",

var Q=null;
function startQuiz(cfg){Q={cfg:cfg,i:0,ok:0,combo:0,maxCombo:0,timer:null,shownB:-1};
 if(cfg.res){Q.i=cfg.res.i||0;Q.ok=cfg.res.ok||0;Q.combo=cfg.res.combo||0;Q.maxCombo=cfg.res.mx||0;}
 nextQ();}
function qOpts(it){var d=it[S.lang];if(it.type==="ox")return["O","X"];if(it.boss)return d?d.o:it.boss.steps[it.step][S.lang].o;return d.o;}
function nextQ(){if(Q.timer){clearInterval(Q.timer);Q.timer=null;}
 var c=Q.cfg;if(Q.i>=c.items.length){S.resume=null;save();c.onDone(Q.ok,c.items.length,Q.maxCombo);return;}
 if(c.rk){S.resume={k:c.rk,i:Q.i,ok:Q.ok,combo:Q.combo,mx:Q.maxCombo,mOk:(typeof L2R!=="undefined"&&L2R)?L2R.mOk:undefined,ids:(c.rk==="l1"?c.items.map(function(x){return x.id;}):undefined)};save();}
 if(c.blocks){var _bi=Math.floor(Q.i/2);if(Q.i%2===0&&Q.shownB!==_bi){Q.shownB=_bi;renderBlock(c,_bi);return;}}
 var it=c.items[Q.i],d=it.boss?it.boss.steps[it.step][S.lang]:it[S.lang];
 var passN=Math.ceil(c.passPct/100*c.items.length);
 setHud(c.title,t("passLbl")+" "+(c.passLbl||passN+"/"+c.items.length)+" · "+t("curLbl")+" "+Q.ok+"/"+Q.i,(Q.i/c.items.length)*100,c.passPct);
 var qtext=it.boss?(S.lang==="ko"?it.boss.bk:it.boss.be)+"<br><br><b>"+t("step")[it.step]+"</b>":esc(d.q);
 var h='<div class="dim" style="margin-bottom:6px;display:flex;justify-content:space-between"><span>'+(Q.i+1)+" / "+c.items.length+(Q.combo>=2?' · 🔥 '+t("combo")+" x"+Q.combo:"")+'</span>'+
 (c.rk?'<span style="cursor:pointer;color:#4da3dd" onclick="if(Q.timer){clearInterval(Q.timer);}scrHome()">✕ '+t("exitS")+'</span>':"")+'</div>';
 if(c.timed)h+='<div id="tmr" class="timer" style="display:inline-block;margin-bottom:8px">⏱ '+c.timed+'s</div>';
 var opts=qOpts(it);Q.perm=opts.map(function(_,ii){return ii;});
 if(it.type!=="ox"){for(var si=Q.perm.length-1;si>0;si--){var sj=Math.floor(Math.random()*(si+1));var tp=Q.perm[si];Q.perm[si]=Q.perm[sj];Q.perm[sj]=tp;}}
 h+='<div class="qcard" id="qc">'+qtext+'</div><div id="opts">'+Q.perm.map(function(oi,di){return '<button class="btn" onclick="pick('+di+')">'+esc(opts[oi])+'</button>';}).join("")+'</div><div id="fb"></div>';
 app(h);
 if(c.timed){Q.left=c.timed;Q.timer=setInterval(function(){Q.left--;var e=$("tmr");if(e)e.textContent="⏱ "+Q.left+"s";if(Q.left<=0){clearInterval(Q.timer);Q.timer=null;pick(-1);}},1000);}}
function pick(idx){if(Q.timer){clearInterval(Q.timer);Q.timer=null;}
 var c=Q.cfg,it=c.items[Q.i],d=it.boss?it.boss.steps[it.step][S.lang]:it[S.lang];
 var ans=it.boss?it.boss.steps[it.step].a:it.a;
 var origIdx=idx<0?-1:Q.perm[idx];var ok=origIdx===ans;
 var btns=$("opts").getElementsByClassName("btn");for(var i=0;i<btns.length;i++){btns[i].classList.add("dis");if(Q.perm[i]===ans)btns[i].classList.add("ok");if(i===idx&&!ok)btns[i].classList.add("no");}
 var fb="";
 if(ok){Q.ok++;Q.combo++;Q.maxCombo=Math.max(Q.maxCombo,Q.combo);var p=10;if(Q.combo>0&&Q.combo%3===0)p+=5;if(c.timed&&Q.left>0)p+=Q.left;addP(p);if(Q.maxCombo>=5)award("b11");
  fb='<div class="exp"><b>'+t("correct")+'</b> '+esc(d.exp)+'</div>';}
 else{Q.combo=0;if(c.penalty)addP(-5);if(c.cat!=="rv")addNote(c.cat,it.id);$("qc").classList.add("shake");
  fb='<div class="exp" style="border-color:var(--bad)"><b style="color:#f0997b">'+t("wrong")+'</b> '+esc(d.exp)+'</div>';}
 if(d.say)fb+='<div class="say"><b>💬 '+t("sayLbl")+':</b><br>"'+esc(d.say)+'"</div>';
 fb+='<button class="btn primary" onclick="this.classList.add(\'dis\');Q.i++;nextQ()">'+t("next")+'</button>';
 $("fb").innerHTML=fb;window.scrollTo(0,document.body.scrollHeight);}
/* ---- Level 1. ---- */
var L1_BLOCKS=[0,1,2,3].map(function(b){return L1_CARDS.slice(b*3,b*3+3);});
function startL1(res){var ids;
 if(res&&res.ids)ids=res.ids;
 else{ids=[];for(var b=0;b<4;b++){var qs=L1_QUIZ.filter(function(q){var ci=parseInt(q.ref.slice(1),10);return ci>b*3&&ci<=b*3+3;});
  qs.sort(function(){return Math.random()-0.5;});ids.push(qs[0].id,qs[1].id);}}
 var items=ids.map(function(id){return L1_QUIZ.filter(function(x){return x.id===id;})[0];});
 startQuiz({items:items,cat:"l1",rk:"l1",res:res,blocks:L1_BLOCKS,title:t("lv1"),passPct:PASS.l1,penalty:false,onDone:doneL1});}
function renderBlock(c,bi){var cards=c.blocks[bi];setHud(c.title,t("learn")+" "+(bi+1)+"/"+c.blocks.length,(Q.i/c.items.length)*100,PASS.l1);
 var h='<div class="dim" style="margin-bottom:6px">'+t("learn")+' · '+(bi+1)+"/"+c.blocks.length+'</div>';
 cards.forEach(function(cd){var k=cd[S.lang];h+='<div class="card"><h3>'+esc(k.t)+'</h3><p class="sub" style="margin:4px 0"><b style="color:var(--gold)">"'+esc(k.a)+'"</b></p><p style="font-size:14px;line-height:1.6">'+esc(k.d)+'</p><div class="say" style="margin:8px 0 0"><b>💬</b> "'+esc(k.s)+'"</div></div>';});
 h+='<button class="btn primary" onclick="nextQ()">'+t("quiz")+'</button>';app(h);}
function doneL1(ok,n){var acc=Math.round(ok/n*100);finishLevel("l1",acc,acc>=PASS.l1,t("acc")+" "+acc+"%");if(acc===100)award("b6");}
function cardLearn(cards,title,onStart){setHud(title,null,0,null);renderFoot("home");var i=0;
 function draw(){var cd=cards[i][S.lang];
  var h='<div class="dim" style="margin-bottom:6px">'+t("learn")+' · '+(i+1)+"/"+cards.length+'</div>';
  h+='<div class="card"><h2 style="color:#4da3dd">'+esc(cd.t)+'</h2><p class="sub" style="font-size:14px;margin:6px 0"><b style="color:var(--gold)">"'+esc(cd.a)+'"</b></p><p style="font-size:14px;line-height:1.7">'+esc(cd.d)+'</p></div>';
  h+='<div class="say"><b>💬 '+t("sayLbl")+':</b><br>"'+esc(cd.s)+'"</div>';
  h+='<button class="btn primary" id="nx">'+(i<cards.length-1?t("next"):t("quiz"))+'</button>';
  if(i>0)h+='<button class="btn" id="pv">←</button>';
  app(h);$("nx").onclick=function(){if(i<cards.length-1){i++;draw();}else onStart();};if($("pv"))$("pv").onclick=function(){i--;draw();};}
 draw();}
/* ---- Level 2. ---- */
function scrL2Learn(){cardLearn(L2_CARDS,t("lv2"),function(){startL2(null);});}
var L2R=null;
function startL2(res){L2R={mOk:(res&&res.mOk)||0};var items=L2_MISSIONS.map(function(m){return{id:m.id,type:"mc",a:m.a,ko:{q:m.ko.q,o:L2_TIERS.ko,exp:m.ko.exp,say:m.ko.say},en:{q:m.en.q,o:L2_TIERS.en,exp:m.en.exp,say:m.en.say}};});
 if(res&&res.k==="l2k"){startL2K(res);return;}
 startQuiz({items:items,cat:"l2m",rk:"l2m",res:(res&&res.k==="l2m")?res:null,title:t("lv2")+" · "+t("mission"),passPct:PASS.l2/4*100,passLbl:PASS.l2+"/4",penalty:false,onDone:function(ok){L2R.mOk=ok;startL2K(null);}});}
function startL2K(res){startQuiz({items:L2_QUIZ,cat:"l2k",rk:"l2k",res:res,title:t("lv2"),passPct:75,penalty:false,onDone:function(ok2,n2){var pass=L2R.mOk>=PASS.l2;finishLevel("l2",L2R.mOk*25+ok2*10,pass,t("mission")+" "+L2R.mOk+"/4");}});}
/* ---- Level 3. ---- */
function startL3(res){var items=L3_ITEMS.slice();startQuiz({items:items,cat:"l3",rk:"l3",res:res,title:t("lv3"),passPct:PASS.l3,penalty:true,timed:25,onDone:function(ok,n){var acc=Math.round(ok/n*100);finishLevel("l3",acc,acc>=PASS.l3,t("acc")+" "+acc+"%");if(ok===n)award("b7");}});}
/* ---- finish ---- */
function finishLevel(key,score,pass,detail){setHud(t(key.replace("l","lv")),null,100,null);renderFoot("home");S.resume=null;
 if(S.best[key]==null||score>S.best[key])S.best[key]=score;
 if(pass&&!S.clear[key]){S.clear[key]=true;award("b"+key.slice(1));}
 hist({t:"level",lv:key,score:score,pass:pass});save();
 sync({type:"level",level:key,score:score,pass:pass,points:S.pts});
 var h='<div class="center" style="padding:26px 0"><div style="font-size:44px">'+(pass?"🎉":"😅")+'</div><h2>'+(pass?t("passOk"):t("passNo"))+'</h2>'+
 '<p class="sub" style="margin:8px 0">'+esc(detail)+' · '+t("score")+" "+score+'</p></div>';
 if(!pass)h+='<button class="btn primary" onclick="openLv('+key.slice(1)+')">'+t("retry")+'</button>';
 else if(key==="l4")h+='<button class="btn primary" onclick="openLv(5)">'+t("lv5go")+'</button>';
 h+='<button class="btn" onclick="scrHome()">'+t("toHome")+'</button>';app(h);}
/* ---- Level 4. select ---- */
function scrMeetSel(){setHud(t("lv4"),t("passLbl")+": 4 × "+t("trust")+" ≥ "+PASS.l4+"%",clearedPicks()/4*100,100);renderFoot("home");
 var rec=L4_MEETINGS.filter(function(m){return S.inds.indexOf(m.ind)>=0;});
 var oth=L4_MEETINGS.filter(function(m){return S.inds.indexOf(m.ind)<0;});
 if(!S.l4picks.length){S.l4picks=rec.slice(0,4).map(function(m){return m.id;});while(S.l4picks.length<4&&oth.length)S.l4picks.push(oth[S.l4picks.length-rec.slice(0,4).length].id);save();}
 var done=Math.min(4,clearedPicks());
 var h='<h2>'+t("meetSel")+'</h2>';
 if(S.clear.l4){h+='<div class="card" style="border-color:var(--good);background:#0f3328"><b style="color:#9fe1cb;font-size:14px">'+t("freeT")+'</b><p class="dim" style="margin-top:5px;color:#7fb8a3">'+t("freeD")+'</p></div>';}
 else{h+='<div class="card" style="border-color:var(--gold)"><b style="color:var(--gold);font-size:15px">🎯 '+t("l4prog1")+" "+done+"/4 — "+(4-done)+t("l4prog2")+'</b>'+
  '<div class="gauge" style="margin-top:10px"><div class="gf" style="width:'+(done/4*100)+'%"></div></div><p class="dim" style="margin-top:6px">'+t("pick4")+'</p></div>';}
 h+='<h3>'+t("meetRec")+'</h3>'+rec.map(meetRow).join("");
 h+='<h3 style="margin-top:14px">'+t("meetAll")+'</h3>'+oth.map(meetRow).join("");
 h+='<button class="btn" onclick="randMeet()">🎲 '+t("meetRnd")+'</button>';
 h+='<button class="btn" onclick="scrHome()">'+t("toHome")+'</button>';app(h);}
function clearedPicks(){return Object.keys(S.meet).filter(function(id){return S.meet[id]&&S.meet[id].ok;}).length;}
function meetRow(m){var ind=INDS.filter(function(x){return x.id===m.ind;})[0];var picked=S.l4picks.indexOf(m.id)>=0;var st=S.meet[m.id];
 return '<div class="card" style="padding:12px 14px"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px">'+
 '<div><b style="font-size:14px">'+esc(S.lang==="ko"?m.tk:m.te)+'</b><div class="dim" style="margin-top:3px"><span class="tag">'+esc(S.lang==="ko"?ind.ko:ind.en)+'</span><span class="tag">'+esc(ROLES[m.role][S.lang])+'</span>'+
 (st&&st.ok?'<span class="tag g">✓ '+t("trust")+" "+st.best+'%</span>':st?'<span class="tag o">'+t("best")+" "+st.best+'%</span>':"")+(picked?'<span class="tag y">★ '+t("picked")+'</span>':"")+'</div></div></div>'+
 '<div style="display:flex;gap:8px;margin-top:10px"><button class="btn" style="margin:0;padding:9px;text-align:center;font-size:13px" onclick="togglePick(\''+m.id+'\')">'+(picked?t("unpick"):t("pickBtn"))+'</button>'+
 '<button class="btn primary" style="margin:0;padding:9px;font-size:13px" onclick="playMeet(\''+m.id+'\')">'+t("startMeet")+'</button></div></div>';}
function togglePick(id){var i=S.l4picks.indexOf(id);if(i>=0)S.l4picks.splice(i,1);else{if(S.l4picks.length>=4){pop(t("needPick"));return;}S.l4picks.push(id);}save();scrMeetSel();}
/* ---- Level 4. play ---- */
var MT=null;
function playMeet(id){var m=L4_MEETINGS.filter(function(x){return x.id===id;})[0];MT={m:m,trust:50,ti:0,log:[]};drawMeet();}
function drawMeet(){var m=MT.m,turn=m.turns[MT.ti];
 S.resume={k:"meet",id:m.id,ti:MT.ti,trust:MT.trust};save();
 setHud((S.lang==="ko"?m.tk:m.te),t("trust")+" "+MT.trust+"% · "+t("passLbl")+" "+PASS.l4+"%",MT.trust,PASS.l4);
 var h='<div class="gauge"><div class="gf" style="width:'+MT.trust+'%;background:'+(MT.trust>=PASS.l4?"var(--good)":"var(--bad)")+'"></div><div class="gm" style="left:'+PASS.l4+'%"></div></div>';
 h+='<div class="dim" style="margin-bottom:10px;display:flex;justify-content:space-between"><span>'+(MT.ti+1)+" / "+m.turns.length+'</span><span style="cursor:pointer;color:#4da3dd" onclick="scrHome()">✕ '+t("exitS")+'</span></div>';
 MT.log.forEach(function(L){h+=L;});
 h+='<div class="bubble"><div class="av">🧑‍💼</div><div class="tx">'+esc(S.lang==="ko"?turn.ck:turn.ce)+'</div></div>';
 h+='<p class="dim" style="margin:8px 0">'+t("turnNote")+'</p><div id="opts">';
 turn.ch.forEach(function(c,i){h+='<button class="btn" onclick="pickMeet('+i+')">'+esc(S.lang==="ko"?c.k:c.e)+'</button>';});
 h+='</div><div id="fb"></div>';app(h);}
function pickMeet(i){var m=MT.m,turn=m.turns[MT.ti],c=turn.ch[i];
 MT.trust=Math.max(0,Math.min(100,MT.trust+c.d));
 MT.log.push('<div class="bubble"><div class="av">🧑‍💼</div><div class="tx">'+esc(S.lang==="ko"?turn.ck:turn.ce)+'</div></div>');
 MT.log.push('<div class="bubble me"><div class="av" style="background:var(--brand)">🙋</div><div class="tx">'+esc(S.lang==="ko"?c.k:c.e)+'</div></div>');
 MT.log.push('<div class="react'+(c.d>0?" good":"")+'">'+esc(S.lang==="ko"?c.rk:c.re)+'</div>');
 if(c.b)addP(15);else if(c.d<0)addP(-0);
 if(!c.b){var best=turn.ch.filter(function(x){return x.b;})[0];MT.log.push('<div class="exp"><b>'+t("better")+':</b> "'+esc(S.lang==="ko"?best.k:best.e)+'"</div>');}
 if(MT.trust<=0){endMeet(false);return;}
 MT.ti++;if(MT.ti>=m.turns.length)endMeet(MT.trust>=PASS.l4);else drawMeet();}
function endMeet(ok){var m=MT.m;var prevOk=!!(S.meet[m.id]&&S.meet[m.id].ok);
 var st=S.meet[m.id]||{best:0,ok:false};st.best=Math.max(st.best,MT.trust);if(ok)st.ok=true;S.meet[m.id]=st;S.resume=null;save();
 if(ok){addP(prevOk?10:30);if(MT.trust>=90)award("b8");checkIndBadge();}
 hist({t:"meet",id:m.id,trust:MT.trust,ok:ok});sync({type:"meeting",id:m.id,trust:MT.trust,ok:ok,points:S.pts});
 setHud(S.lang==="ko"?m.tk:m.te,null,100,null);
 var h='<div class="center" style="padding:24px 0"><div style="font-size:44px">'+(ok?"🤝":"🚪")+'</div><h2>'+(ok?t("meetPass"):MT.trust<=0?t("meetFail"):t("meetLow"))+'</h2><p class="sub">'+t("trust")+" "+MT.trust+'%</p></div>';
 if(!ok)h+='<button class="btn primary" onclick="playMeet(\''+m.id+'\')">'+t("retry")+'</button>';
 h+='<button class="btn" onclick="checkL4()">'+t("next")+'</button>';app(h);}
function checkL4(){if(!S.clear.l4&&clearedPicks()>=4){finishLevel("l4",Math.round(avgTrust()),true,t("trust")+" "+t("best")+" "+Math.round(avgTrust())+"%");}else scrMeetSel();}
function avgTrust(){var s=0,c=0;for(var id in S.meet){if(S.meet[id]&&S.meet[id].ok){s+=S.meet[id].best;c++;}}return c?s/c:0;}
/* ---- Level 5. ---- */
function startL5(res){var items=[];L5_BOSS.forEach(function(b,bi){b.steps.forEach(function(st,si){items.push({id:bi+"-"+si,type:"mc",boss:b,step:si});});});
 startQuiz({items:items,cat:"l5",rk:"l5",res:res,title:t("lv5")+" · "+t("boss"),passPct:PASS.l5,penalty:true,onDone:function(ok,n){var acc=Math.round(ok/n*100);var pass=acc>=PASS.l5;finishLevel("l5",acc,pass,t("acc")+" "+acc+"%");if(pass)setTimeout(function(){S.survey?scrCert():scrSurvey();},900);}});}
/* ---- Certificate ---- */
function scrCert(){setHud(t("cert"),null,100,null);renderFoot("home");
 var dt=new Date().toISOString().slice(0,10);
 var h='<div class="card center" id="certbox" style="border-color:var(--gold);padding:28px 16px"><div style="font-size:44px">🏆</div>'+
 '<h2 style="color:var(--gold);margin:8px 0">Daol Fusion Master</h2><div style="font-size:17px;font-weight:600">'+esc(S.name)+(S.dept?' · '+esc(S.dept):"")+'</div>'+
 '<p class="sub" style="margin:8px 0">'+S.pts+' '+t("pts")+' · '+t("badge")+" "+S.badges.length+"/12 · "+dt+'</p>'+
 '<p class="dim" style="border-top:1px solid var(--line);padding-top:10px;margin-top:8px">'+t("certDone")+'</p></div>';
 h+='<button class="btn primary" onclick="saveCert()">📥 '+t("certSave")+'</button>';if(!S.survey)h+='<button class="btn" onclick="scrSurvey()">📋 '+t("svT")+'</button>';h+='<button class="btn" onclick="scrHome()">'+t("toHome")+'</button>';
 app(h);sync({type:"certificate",points:S.pts,badges:S.badges.length});}
function saveCert(){var cv=document.createElement("canvas");cv.width=800;cv.height=1000;var x=cv.getContext("2d");
 x.fillStyle="#0d1b2a";x.fillRect(0,0,800,1000);x.strokeStyle="#efb832";x.lineWidth=6;x.strokeRect(30,30,740,940);
 x.fillStyle="#0060a0";x.fillRect(60,60,680,8);x.textAlign="center";
 x.fillStyle="#efb832";x.font="bold 54px sans-serif";x.fillText("🏆",400,220);x.fillText("DAOL FUSION MASTER",400,310);
 x.fillStyle="#e6f1fb";x.font="bold 44px sans-serif";x.fillText(S.name+(S.dept?" · "+S.dept:""),400,430);
 x.fillStyle="#8fb6d4";x.font="28px sans-serif";x.fillText("Daol Fusion Quest — AI Sales Master",400,500);
 x.fillText(S.pts+" P  ·  "+t("badge")+" "+S.badges.length+"/12",400,560);
 x.fillText(new Date().toISOString().slice(0,10),400,620);
 x.fillStyle="#4da3dd";x.font="24px sans-serif";x.fillText(t("certDone"),400,720);
 x.fillStyle="#5a6b7d";x.font="20px sans-serif";x.fillText("DAOL TS · Daol Fusion",400,900);
 var a=document.createElement("a");a.download="DaolFusion_Master_"+S.name+".png";a.href=cv.toDataURL("image/png");a.click();}
/* ---- Review note ---- */
function scrNote(){setHud(t("note"),null,0,null);renderFoot("note");
 var act=S.notes.filter(function(n){return !n.grad;}),grad=S.notes.filter(function(n){return n.grad;});
 var h='<h2>'+t("note")+'</h2>';
 if(!S.notes.length){h+='<p class="sub" style="padding:20px 0">'+t("noteEmpty")+'</p>';}
 else{if(act.length)h+='<button class="btn primary" onclick="startReview()">📚 '+t("reviewStart")+' ('+act.length+')</button>';
  S.notes.slice().sort(function(a,b){return b.ts-a.ts;}).forEach(function(n){var it=noteItem(n);if(!it)return;var d=it.boss?it.boss.steps[it.step][S.lang]:it[S.lang];var q=it.boss?(S.lang==="ko"?it.boss.tk:it.boss.te)+" · "+t("step")[it.step]:d.q;
   h+='<div class="card" style="padding:12px 14px'+(n.grad?";opacity:.55":"")+'"><div style="font-size:13px;line-height:1.5">'+esc(q)+'</div><div class="dim" style="margin-top:6px">'+(n.grad?'<span class="tag g">✓ '+t("grad")+'</span>':'<span class="tag o">'+n.cnt+" "+t("noteTimes")+'</span>')+'</div><div class="exp" style="margin:8px 0 0;font-size:13px">'+esc(d.exp)+'</div></div>';});}
 app(h);}
function startReview(){var act=S.notes.filter(function(n){return !n.grad;});var items=act.map(function(n){return noteItem(n);}).filter(Boolean);
 if(!items.length){scrNote();return;}
 startQuiz({items:items,cat:"rv",title:t("note"),passPct:100,penalty:false,onDone:function(){scrNote();}});
 /* review 전용 판정 훅 */
 var origPick=pick;}
/* review: pick 내부에서 cat==='rv' 처리 — 노트 streak 갱신 */
var _pick=pick;
pick=function(idx){var c=Q.cfg,it=c.items[Q.i];_pick(idx);
 if(c.cat==="rv"){var ans=it.boss?it.boss.steps[it.step].a:it.a;var oi=idx<0?-1:Q.perm[idx];var n=S.notes.filter(function(x){return x.qid===it.id&&!x.grad;})[0];
  if(n){if(oi===ans){n.streak=(n.streak||0)+1;if(n.streak>=2){n.grad=true;addP(3);pop("✅ "+t("grad")+" +3 "+t("pts"));if(S.notes.filter(function(x){return x.grad;}).length>=5)award("b10");}}
  else{n.streak=0;n.cnt++;}save();}}};
/* ---- History / Badges ---- */
function scrHist(){setHud(t("hist"),null,0,null);renderFoot("hist");
 var h='<h2>'+t("hist")+'</h2>';
 if(!S.hist.length)h+='<p class="sub" style="padding:20px 0">'+t("histEmpty")+'</p>';
 S.hist.slice().reverse().slice(0,80).forEach(function(e){var d=new Date(e.ts),ds=d.getMonth()+1+"/"+d.getDate()+" "+("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2);var tx="";
  if(e.ev.t==="level")tx=(e.ev.pass?"✅ ":"❌ ")+t(e.ev.lv.replace("l","lv"))+" · "+t("score")+" "+e.ev.score;
  else if(e.ev.t==="meet"){var m=L4_MEETINGS.filter(function(x){return x.id===e.ev.id;})[0];tx=(e.ev.ok?"🤝 ":"🚪 ")+(m?(S.lang==="ko"?m.tk:m.te):e.ev.id)+" · "+e.ev.trust+"%";}
  else if(e.ev.t==="badge"){var b=BADGES.filter(function(x){return x.id===e.ev.id;})[0];tx="🏆 "+(b?(S.lang==="ko"?b.ko[0]:b.en[0]):"");}
  else if(e.ev.t==="survey")tx="📋 "+t("svT");else tx=JSON.stringify(e.ev);
  h+='<div class="row"><span style="flex:1;padding-right:8px">'+tx+'</span><span class="dim">'+ds+'</span></div>';});
 app(h);}
function scrBadge(){setHud(t("badge"),null,0,null);renderFoot("badge");
 var h='<h2>'+t("badge")+' ('+S.badges.length+'/12)</h2>';
 BADGES.forEach(function(b){var on=S.badges.indexOf(b.id)>=0;var L=S.lang==="ko"?b.ko:b.en;
  h+='<div class="badge'+(on?"":" off")+'"><span class="bi">'+b.i+'</span><div><div class="bn">'+esc(L[0])+'</div><div class="bd">'+esc(L[1])+'</div></div></div>';});
 app(h);}
/* ---- random meeting brief ---- */
function randMeet(){var m=L4_MEETINGS[Math.floor(Math.random()*L4_MEETINGS.length)];scrMeetBrief(m.id);}
function scrMeetBrief(id){var m=L4_MEETINGS.filter(function(x){return x.id===id;})[0];var ind=INDS.filter(function(x){return x.id===m.ind;})[0];
 setHud(t("lv4"),null,0,null);renderFoot("home");
 app('<div class="center" style="padding:20px 0 8px"><div style="font-size:40px">🤝</div><p class="dim" style="margin:8px 0 4px">'+t("briefT")+'</p>'+
 '<h2>'+esc(S.lang==="ko"?m.tk:m.te)+'</h2>'+
 '<div style="margin:8px 0 18px"><span class="tag">'+esc(S.lang==="ko"?ind.ko:ind.en)+'</span><span class="tag">'+esc(ROLES[m.role][S.lang])+'</span>'+(S.meet[id]&&S.meet[id].ok?'<span class="tag g">✓ '+t("cleared")+'</span>':"")+'</div></div>'+
 '<button class="btn primary" onclick="playMeet(\''+id+'\')">'+t("startMeet")+'</button>'+
 '<button class="btn" onclick="randMeet()">'+t("again")+'</button>'+
 '<button class="btn" onclick="scrMeetSel()">'+t("backB")+'</button>');}
/* ---- survey ---- */
var SV=null;
function scrSurvey(){SV={};setHud(t("svT"),null,0,null);renderFoot("home");
 function scale(q){var s='<div style="display:flex;gap:6px;margin:8px 0 4px">';for(var i=1;i<=5;i++)s+='<span class="chip" id="'+q+i+'" onclick="svPick(\''+q+'\','+i+')" style="flex:1;text-align:center;margin:0">'+i+'</span>';return s+'</div><p class="dim">'+t("svScale")+'</p>';}
 var h='<h2>📋 '+t("svT")+'</h2>';
 h+='<div class="card"><b style="font-size:14px">1. '+t("sv1")+'</b>'+scale("a")+'</div>';
 h+='<div class="card"><b style="font-size:14px">2. '+t("sv2")+'</b>'+scale("b")+'</div>';
 h+='<div class="card"><b style="font-size:14px">3. '+t("sv3")+'</b><div style="margin-top:8px">'+[1,2,3,4,5].map(function(n){return '<span class="chip" id="c'+n+'" onclick="svPick(\'c\','+n+')">Level '+n+'</span>';}).join("")+'</div></div>';
 h+='<div class="card"><b style="font-size:14px">4. '+t("sv4")+'</b><div style="margin-top:8px">'+t("sv4o").map(function(o,i){return '<span class="chip" id="d'+(i+1)+'" onclick="svPick(\'d\','+(i+1)+')">'+esc(o)+'</span>';}).join("")+'</div>'+
 '<input type="text" id="svetc" placeholder="'+t("svEtcPh")+'" style="margin-top:8px"></div>';
 h+='<button class="btn primary" onclick="svSubmit()">'+t("svSubmit")+'</button><button class="btn" onclick="scrCert()">'+t("svSkip")+'</button>';
 app(h);}
function svPick(q,v){SV[q]=v;for(var i=1;i<=5;i++){var el=$(q+i);if(el){if(SV[q]===i)el.classList.add("on");else el.classList.remove("on");}}}
function svSubmit(){var eb=$("svetc");S.survey={understand:SV.a||null,confidence:SV.b||null,bestLevel:SV.c||null,hardest:SV.d?t("sv4o")[SV.d-1]:null,etc:eb?eb.value.trim():"",ts:new Date().toISOString()};save();addP(5);pop(t("svDone"));hist({t:"survey"});sync({type:"survey",survey:S.survey,points:S.pts});scrCert();}
/* ---- boot ---- */
load();
var today=new Date().toISOString().slice(0,10);
if(S.lastDay!==today){S.sessions++;S.lastDay=today;save();if(S.sessions>=5)award("b12");}
flushQueue();maybeSnapshot();
/* 뒤로가기 가드: 페이지 이탈 대신 홈으로 (진행은 자동 저장됨)
   Edge/Chrome은 사용자 조작 전에 쌓은 히스토리를 뒤로가기에서 건너뛰므로,
   첫 클릭/터치 순간에 가드를 심는다 */
(function(){
 var armed=false;
 function arm(){try{history.pushState({dfq:1},"");}catch(e){}}
 function onFirst(){if(armed)return;armed=true;arm();arm();}
 try{
  ["pointerdown","touchstart","keydown"].forEach(function(ev){
   window.addEventListener(ev,onFirst,{passive:true});});
  window.addEventListener("popstate",function(){
   arm();
   if(typeof Q!=="undefined"&&Q&&Q.timer){clearInterval(Q.timer);Q.timer=null;}
   if(S&&S.onboarded)scrHome();});
 }catch(e){}
})();
if(!S.onboarded)scrOnboard();else scrHome();
</script>
</body>
